[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cost-autopilot"
dynamic = ["version"]
description = "A local-first LLM routing and evaluation service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.7,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pandas>=2.2,<4.0",
    "pydantic>=2.10,<3.0",
    "PyYAML>=6.0,<7.0",
    "streamlit>=1.40,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear
select = ["E", "F", "I", "UP", "B"]
